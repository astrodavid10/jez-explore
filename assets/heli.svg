<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Ingenuity helicopter">
  <!-- Ingenuity marker. Violet #b57bff rotor cross over a small fuselage, dark outline.
       E6 2026-08-25: was cyan #b57bff, which competed with the blue contours. -->
  <g stroke="#1d0f36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- coaxial rotor discs, seen from above as a cross -->
    <path d="M4 8 H20" fill="none" stroke-width="2.2"/>
    <path d="M6.2 11.2 H17.8" fill="none" stroke-width="2.2"/>
    <!-- hub -->
    <circle cx="12" cy="9.6" r="1.9" fill="#b57bff"/>
    <!-- fuselage box -->
    <rect x="9" y="13.6" width="6" height="5" rx="1.2" fill="#b57bff"/>
    <!-- landing legs -->
    <path d="M9.6 18.6 L7.6 21.4 M14.4 18.6 L16.4 21.4" fill="none"/>
  </g>
  <g stroke="#b57bff" stroke-width="2.2" stroke-linecap="round">
    <path d="M4 8 H20" fill="none"/>
    <path d="M6.2 11.2 H17.8" fill="none"/>
  </g>
</svg>
