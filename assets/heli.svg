<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Ingenuity helicopter">
  <!-- Ingenuity marker, seen from above-ish. Violet #b57bff, dark outline.
       F2 2026-08-25: redrawn. The old glyph was a bare rotor cross that read as
       a plus sign at 24 px; this one carries the four things that actually make
       Ingenuity recognisable - the COAXIAL pair of rotor discs (two spans, not
       one), the square solar panel standing above them on the mast, the boxy
       fuselage, and the four splayed landing legs. Drawn at the same weight as
       rover.svg so Percy and Ginny read as a matched pair of markers.
       E6b/F1: violet, matching PALETTE.heli. -->
  <g stroke="#1d0f36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- landing legs, drawn first so the body sits on top of them -->
    <path d="M9.2 17.4 L6.6 21.2 M14.8 17.4 L17.4 21.2
             M10.4 17.6 L9.0 21.4 M13.6 17.6 L15.0 21.4" fill="none"/>
    <!-- fuselage -->
    <rect x="9.1" y="13.2" width="5.8" height="4.6" rx="1.1" fill="#b57bff"/>
    <!-- mast -->
    <path d="M12 13.2 V4.6" fill="none"/>
    <!-- solar panel above the rotors -->
    <rect x="9.4" y="2.4" width="5.2" height="2.4" rx="0.6" fill="#b57bff"/>
  </g>
  <!-- the coaxial rotor pair: two spans at slightly different widths so they
       read as two stacked discs rather than one thick bar -->
  <g stroke="#1d0f36" stroke-width="3.4" stroke-linecap="round">
    <path d="M3.2 8.2 H20.8" fill="none"/>
    <path d="M5.4 11.3 H18.6" fill="none"/>
  </g>
  <g stroke="#b57bff" stroke-width="1.9" stroke-linecap="round">
    <path d="M3.2 8.2 H20.8" fill="none"/>
    <path d="M5.4 11.3 H18.6" fill="none"/>
  </g>
  <!-- rotor hub -->
  <circle cx="12" cy="9.7" r="1.7" fill="#b57bff" stroke="#1d0f36" stroke-width="1.3"/>
</svg>
