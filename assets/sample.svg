<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="Sample tube">
  <!-- Sample tube marker. Orange #ff9f40 capsule, dark outline. -->
  <g stroke="#2b1503" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- tube body, tilted -->
    <rect x="7.1" y="3" width="5.8" height="14" rx="2.9" fill="#ff9f40"
          transform="rotate(24 10 10)"/>
    <!-- cap band -->
    <path d="M6.2 6.6 L12.5 3.8" fill="none"/>
  </g>
</svg>
